<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steer on a sphere — live</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0b0f17; --panel:rgba(18,24,38,.85); --line:rgba(120,150,200,.25); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
              font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#d8e2f2; }
  #c { position:fixed; inset:0; display:block; }
  .hud { position:fixed; top:14px; left:14px; background:var(--panel);
         border:1px solid var(--line); border-radius:10px; padding:12px 14px;
         min-width:300px; backdrop-filter:blur(6px); box-shadow:0 6px 24px rgba(0,0,0,.4); z-index:10; }
  .hud h1 { margin:0 0 4px; font-size:13px; letter-spacing:.06em; color:#9fb4dd; font-weight:600; }
  .hud .promptline { margin:0 0 8px; color:#6f87b3; font-size:11px; max-width:300px;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud .row { display:flex; justify-content:space-between; gap:16px; margin:3px 0; }
  .hud .row .k { color:#7d90b5; } .hud .row .v { color:#e9f1ff; }
  .hud .tok { color:#7ee2a8; font-weight:700; }
  .hud .ctl { display:flex; gap:6px; margin-top:8px; }
  .hud input { flex:1; min-width:0; background:#0d1424; color:#e9f1ff; border:1px solid var(--line);
               border-radius:6px; padding:5px 8px; font:inherit; }
  .hud button { background:#1b2a48; color:#cfe0ff; border:1px solid var(--line); border-radius:6px;
                padding:5px 10px; font:inherit; cursor:pointer; }
  .hud button:hover { background:#24395f; }
  .hud button.on { background:#3a5a9a; color:#fff; }
  .hud .hint { margin-top:10px; padding-top:8px; border-top:1px solid var(--line);
               color:#64779c; font-size:11px; }
  .genbox { margin:6px 0; padding:6px 8px; background:rgba(10,16,30,.7); border:1px solid var(--line);
            border-radius:8px; max-width:300px; max-height:110px; overflow-y:auto;
            font-size:11.5px; line-height:1.55; color:#dce8ff; word-break:break-word; }
  .genbox .seed { color:#6f87b3; }
  .genbox .tok { color:#7ee2a8; }
  #topk { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px; max-width:300px;
          max-height:96px; overflow-y:auto; }
  #topk .tokchip { background:#152238; color:#dce8ff; border:1px solid #2b4470;
                   border-radius:12px; padding:2px 8px; font-size:11px; cursor:pointer; }
  #topk .tokchip:hover { background:#27497d; }
  .tooltip { position:fixed; display:none; z-index:30; pointer-events:none;
             background:rgba(8,12,22,.92); border:1px solid #3a5a9a; border-radius:8px;
             padding:4px 9px; font-size:12px; color:#dce8ff; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .compass { position:fixed; right:16px; bottom:16px; width:110px; height:110px;
             background:rgba(10,15,25,.72); border:1px solid var(--line); border-radius:50%;
             backdrop-filter:blur(4px); z-index:10; }
  .compass .n, .compass .e, .compass .s, .compass .w { position:absolute; width:22px;
             text-align:center; left:50%; margin-left:-11px; font-size:12px; color:#7d90b5; }
  .compass .n { top:4px; color:#ff8a80; font-weight:700; }
  .compass .e { top:calc(50% - 8px); left:auto; right:4px; margin:0; }
  .compass .s { bottom:4px; }
  .compass .w { top:calc(50% - 8px); left:4px; margin:0; }
  .compass .needle { position:absolute; left:50%; top:50%; width:2px; height:42px;
             margin:-42px 0 0 -1px; transform-origin:50% 100%; background:#ffc400;
             box-shadow:0 0 8px #ffc40088; border-radius:1px; }
  .legend { position:fixed; top:14px; right:14px; background:var(--panel);
            border:1px solid var(--line); border-radius:10px; padding:10px 12px;
            backdrop-filter:blur(6px); z-index:10; }
  .legend .item { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .legend .sw { width:10px; height:10px; border-radius:50%; }
  .toast { position:fixed; bottom:140px; left:50%; transform:translateX(-50%);
           background:#3a1a1a; color:#ffb3b3; border:1px solid #7a3030;
           padding:8px 16px; border-radius:8px; display:none; max-width:80%; z-index:20; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1 id="h-model">steer on a sphere</h1>
  <p class="promptline" id="h-prompt"></p>
  <div class="row"><span class="k">gen</span><span class="v" id="h-gen" style="font-size:11px;word-break:break-all;max-width:300px;">—</span></div>
  <div class="genbox" id="genbox"><span class="seed" id="gen-seed"></span><span class="tok" id="gen-toks"></span></div>
  <div class="row"><span class="k">sphere</span><span class="v" id="h-layer">—</span></div>
  <div class="row"><span class="k">lat</span><span class="v" id="h-lat">—</span></div>
  <div class="row"><span class="k">az</span><span class="v" id="h-az">—</span></div>
  <div class="row"><span class="k">topic</span><span class="v" id="h-topic">—</span></div>
  <div class="row"><span class="k">token</span><span class="v tok" id="h-token">—</span></div>
  <div class="row"><span class="k">transitions</span><span class="v" id="h-trans">0</span></div>
  <div class="ctl">
    <input id="inp-prompt" placeholder="seed prompt… (Enter)" spellcheck="false">
    <button id="btn-seed">seed</button>
  </div>
  <div class="ctl">
    <button id="btn-reset">Reset</button>
    <button id="btn-lock">N off</button>
    <button id="btn-fp">FPV</button>
    <button id="btn-gen">gen on</button>
    <button id="btn-pole">◎ pole view</button>
  </div>
  <div id="topk" style="display:none;"></div>
  <div class="hint">click a token → steer · <b>click a candidate</b> → choose it · ← →  ring · <b>l</b> layer · <b>f</b> FPV · drag orbit</div>
</div>

<div class="legend" id="legend"></div>

<div class="compass" title="compass">
  <div class="n">N</div><div class="e">E</div><div class="s">S</div><div class="w">W</div>
  <div class="needle" id="needle"></div>
</div>

<div class="toast" id="toast"></div>
<div class="tooltip" id="hover-tip"></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const COLORS = {
  food:'#ff7043', animal:'#ffd54f', color:'#ba68c8',
  city:'#4fc3f7', nature:'#81c784', number:'#ff5252',
};
const TOPIC_ORDER = ['food','animal','color','city','nature','number'];

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path+' -> '+r.status);
  return r.json();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg;
  t.style.display='block'; setTimeout(()=>t.style.display='none', 2500); }

// ---- scene ------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f17);
scene.add(new THREE.AmbientLight(0xffffff, .35));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(3,2,4); scene.add(sun);
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .01, 100);
cam.position.set(2.6,1.7,2.9);
const ctrl = new OrbitControls(cam, canvas); ctrl.enableDamping = true;

scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,48,32),
  new THREE.MeshStandardMaterial({color:0x16233f, transparent:true, opacity:.5,
                                  wireframe:true, roughness:.9})));
// pole axis + labels
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
  [new THREE.Vector3(0,0,-1.15), new THREE.Vector3(0,0,1.15)]),
  new THREE.LineBasicMaterial({color:0x4a6ca8, transparent:true, opacity:.6})));
scene.add(poleLabel('S', 0,0,-1.34)); scene.add(poleLabel('N', 0,0,1.34));
function poleLabel(txt, x,y,z){
  const c=document.createElement('canvas'); c.width=96;c.height=96;
  const g=c.getContext('2d'); g.font='700 64px Arial'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#ff8a80'; g.fillText(txt,48,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    transparent:true,depthTest:false})); s.position.set(x,y,z); s.scale.set(.16,.16,.16); return s;
}
// latitude rings (every 30 deg)
const latMat = new THREE.LineBasicMaterial({color:0x2c4470, transparent:true, opacity:.35});
for (const lat of [30,60,120,150]){
  const pts=[]; for (let i=0;i<=64;i++){ const a=i*Math.PI*2/64;
    pts.push(new THREE.Vector3(Math.sin(lat*Math.PI/180)*Math.cos(a),
      Math.sin(lat*Math.PI/180)*Math.sin(a), Math.cos(lat*Math.PI/180))); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), latMat));
}
// equator ring
scene.add(new THREE.Mesh(new THREE.RingGeometry(.985,1.015,96),
  new THREE.MeshBasicMaterial({color:0x3d5a8f, transparent:true, opacity:.55,
    side:THREE.DoubleSide})));
// 4 compass azimuth labels on the equator
for (const [deg,lab] of Object.entries({0:'N', 90:'E', 180:'S', 270:'W'})){
  const a=THREE.MathUtils.degToRad(deg);
  const s=poleLabel(lab, Math.cos(a)*1.18, Math.sin(a)*1.18, 0);
  s.scale.setScalar(.12); scene.add(s);
}

// invisible "steer here" sphere used for click-to-walk on empty spots
const steerSphere = new THREE.Mesh(new THREE.SphereGeometry(1.02, 32, 16),
  new THREE.MeshBasicMaterial({visible:false}));
scene.add(steerSphere);

const topicGroup = new THREE.Group(); scene.add(topicGroup);
const ringGroup = new THREE.Group(); scene.add(ringGroup);   // DYNAMIC ring-token field
const trailMat = new THREE.LineBasicMaterial({color:0x8fd0ff, transparent:true, opacity:.85});
const trailLine = new THREE.Line(new THREE.BufferGeometry(), trailMat); scene.add(trailLine);
const posOf=(azDeg,latDeg)=>{ const t=THREE.MathUtils.degToRad(latDeg),
  p=THREE.MathUtils.degToRad(azDeg);
  return new THREE.Vector3(Math.sin(t)*Math.cos(p), Math.sin(t)*Math.sin(p), Math.cos(t)); };
function labelSprite(text,color){
  const c=document.createElement('canvas'); c.width=384;c.height=96;
  const g=c.getContext('2d'); g.font='600 52px Arial'; g.textBaseline='middle'; g.textAlign='center';
  g.shadowColor='rgba(0,0,0,.8)'; g.shadowBlur=12; g.fillStyle=color; g.fillText(text,192,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    transparent:true,depthTest:false})); s.scale.set(.5,.125,1); return s;
}

// ---- the steer walker ----
// (walker model loaded below)
  const cow = new THREE.Group();
cow.userData.base = new THREE.Vector3(0,1,0);
scene.add(cow);
const walkerLoader = new GLTFLoader();
const walkerSrc = '/models/steer_no_blue_ball.glb';
function noop(){}
function onWalkerLoaded(gltf){
  const m = gltf.scene;
  m.rotation.z = Math.PI;                        // model nose is at -X -> face forward (X+)
  const box = new THREE.Box3().setFromObject(m);
  const size = box.getSize(new THREE.Vector3());
  const target = 0.2;                            // ~20% of sphere radius
  const s = target / Math.max(size.x, size.y, size.z);
  m.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(m);      // recompute AFTER scale
  const c2 = box2.getCenter(new THREE.Vector3());
  m.position.sub(c2);                           // now truly centered
  const size2 = box2.getSize(new THREE.Vector3());
  m.position.z = -size2.z / 2 + 0.035;          // feet at z=0 + tiny lift
  // friendly eyes: bright glossy whites + solid black pupils
  const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff,
    emissiveIntensity:0.55, roughness:0.3, metalness:0.0});
  const pupilMat = new THREE.MeshBasicMaterial({color:0x111111});
  // eyes + legs: safe per-mesh tweaks, no reparenting
  const legNames = ['frontLupper','frontLlower','frontRupper','frontRlower',
                    'backLupper','backLlower','backRupper','backRlower'];
  m.traverse((o)=>{
    if (!o.isMesh) return;
    const n = o.name || '';
    if (n.startsWith('eyeWhite')) o.material = eyeWhiteMat;
    else if (n.startsWith('pupil')) o.material = pupilMat;
    else if (legNames.includes(n)) o.scale.setScalar(1.18);   // close the Rayman gaps
  });
  cow.add(m);
  window.__walkerDebug = {
    size: size.toArray(),
    s: s,
    centerAfter: c2.toArray(),
    finalPos: m.position.toArray(),
  };
}
function onWalkerError(err){
  console.warn('walker model load failed', err);
}
walkerLoader.load(walkerSrc, onWalkerLoaded, noop, onWalkerError);

// ---- data / state -----------------------------------------------------
const meta = {model:'', layers:[], spi:0, state:null};
const topicMeshes = {};
const clickables = [steerSphere];
let busy = false;
const needleEl = document.getElementById('needle');
const btnLockEl = document.getElementById('btn-lock');
let lockNorth = false, lockedYaw = 0;
let lastDir = 'left', firstPerson = false, headYaw = 0, headPitch = 0;
let prevState = null;
const btnFpEl = document.getElementById('btn-fp');
let genMode = true;

function projectTopicMarkers(layers){
  topicGroup.clear(); clickables.length = 0; clickables.push(steerSphere);
  const az = layers[meta.spi].azimuths;
  for (const t of TOPIC_ORDER){
    const g=new THREE.Mesh(new THREE.SphereGeometry(.045,20,12),
      new THREE.MeshStandardMaterial({color:COLORS[t], emissive:COLORS[t], emissiveIntensity:.45}));
    g.position.copy(posOf(az[t],90)); topicGroup.add(g); topicMeshes[t]=g;
    g.userData.az = az[t]; clickables.push(g);
    const s=labelSprite(t.toUpperCase(), COLORS[t]);
    s.position.copy(posOf(az[t],90)).multiplyScalar(1.16); topicGroup.add(s);
    s.userData.az = az[t]; clickables.push(s);
  }
  // ring token field is drawn dynamically from each state's ringNow (see updateRing)
}

function orientCow(az, lat, dir){
  const p = posOf(az, lat);
  cow.userData.base.copy(p);
  const east = posOf(az+0.5, lat).sub(posOf(az-0.5, lat)).normalize();
  const north = posOf(az, lat+0.5).sub(posOf(az, lat-0.5)).normalize();
  let fwd;
  if (dir === 'right') fwd = east.clone().negate();
  else if (dir === 'up') fwd = north.clone().negate();
  else if (dir === 'down') fwd = north.clone();
  else fwd = east;
  const lateral = new THREE.Vector3().crossVectors(p, fwd).normalize();
  const m = new THREE.Matrix4().makeBasis(fwd, lateral, p);   // local Z (up) -> radial
  cow.quaternion.setFromRotationMatrix(m);
  cow.userData.forward = fwd;
}

function updateRing(ringNow){
  ringGroup.clear();
  const tickMat = new THREE.LineBasicMaterial({color:0x35507f, transparent:true, opacity:.5});
  for (let a = 0; a < 360; a += 40){
    ringGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [posOf(a,90).multiplyScalar(.97), posOf(a,90).multiplyScalar(1.045)]), tickMat));
  }
  for (const ent of (ringNow || [])){
    const s = labelSprite(ent.token, '#8fd0ff');
    s.position.copy(posOf(ent.az, 90)).multiplyScalar(1.16);
    s.scale.multiplyScalar(.72);
    ringGroup.add(s);
    s.userData.az = ent.az; clickables.push(s);
  }
}
function applyState(st){
  meta.state=st;
  if (prevState){
    let daz = st.az - prevState.az;
    daz = ((daz + 180) % 360 + 360) % 360 - 180;
    const dlat = st.lat - prevState.lat;
    if (Math.abs(daz) > 0.5 && Math.abs(daz) >= Math.abs(dlat)) lastDir = daz > 0 ? 'left' : 'right';
    else if (Math.abs(dlat) > 0.5) lastDir = dlat > 0 ? 'down' : 'up';
  }
  prevState = st;
  document.getElementById('h-layer').textContent='layer '+st.layer;
  document.getElementById('h-lat').textContent=st.lat+'°';
  document.getElementById('h-az').textContent=st.az+'°';
  document.getElementById('h-topic').textContent=st.topic;
  document.getElementById('h-token').textContent=st.token;
  document.getElementById('h-trans').textContent=st.transitions;
  orientCow(st.az, st.lat, lastDir);
  updateRing(st.ringNow);                     // LIVE ring-token field
  needleEl.style.transform=`rotate(${(-st.az)%360}deg)`;
  const pts=(st.trail||[]).map(([a,e])=>posOf(a,90-e));
  trailLine.geometry.dispose(); trailLine.geometry=new THREE.BufferGeometry().setFromPoints(pts);
  for (const t of TOPIC_ORDER){
    const m = topicMeshes[t]; if (!m) continue;
    m.material.emissiveIntensity = (t === st.topic) ? 0.95 : 0.45;
    m.scale.setScalar(t === st.topic ? 1.6 : 1);
  }
  document.getElementById('gen-seed').textContent = (st.prompt_seed || '') + ' ';
  document.getElementById('gen-toks').textContent = (st.generation || '').slice(-400);
  refreshTopk();
}

async function refreshTopk(){
  try{
    const el = document.getElementById('topk');
    const d = await api('/api/topk', {k:12});
    const toks = d.tokens || [];
    if (!toks.length){ el.style.display='none'; return; }
    el.style.display='block';
    el.innerHTML = toks.map(t =>
      `<button class="tokchip" data-id="${t.id}">${t.token.replace(/[<>&'"]/g,'')||'\u00b7'}</button>`).join(' ');
    el.querySelectorAll('.tokchip').forEach(b =>
      b.addEventListener('click', ()=> chooseToken(Number(b.dataset.id))));
  } catch(e){ /* non-fatal */ }
}

async function chooseToken(id){
  if (busy) return; busy = true;
  try{ applyState(await api('/api/choose', {token:id})); }
  catch(e){ toast('choose failed: '+e.message); }
  finally{ busy = false; }
}
function buildLegend(){
  const l=document.getElementById('legend');
  l.innerHTML='<h1 style="margin:0 0 4px;font-size:12px;color:#9fb4dd;">topics</h1>';
  for (const t of TOPIC_ORDER){ const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<span class="sw" style="background:${COLORS[t]}"></span>${t}`; l.appendChild(d); }
}

// ---- actions ------------------------------------------------------------
async function doMove(dir){ try{ applyState(await api('/api/move',{dir})); }
  catch(e){ toast('move failed: '+e.message); } }
async function doReset(){
  try{ applyState(await api('/api/reset', {})); }
  catch(e){ toast('reset failed: '+e.message); } }
async function doGo(az){
  if (busy) return; busy = true;
  try{ applyState(await api('/api/go', {az})); }
  catch(e){ toast('go failed: '+e.message); }
  finally{ busy = false; } }
async function cycleLayer(){
  const L=meta.layers; if(!L.length || busy) return; busy = true;
  try{
    meta.spi=(meta.spi+1)%L.length; projectTopicMarkers(L);
    const st = await api('/api/reset', {layer: L[meta.spi].layer});
    meta.spi = Math.max(0, meta.layers.findIndex(l=>l.layer===st.layer));
    applyState(st);
  } catch(e){ toast('layer failed: '+e.message); } finally{ busy = false; } }
async function seedPrompt(text){
  if (busy) return; busy = true;
  try{
    await api('/api/prompt', {prompt:text});
    const md = await api('/api/layers');
    meta.layers = md.layers;
    document.getElementById('h-prompt').textContent = md.prompt || '';
    projectTopicMarkers(meta.layers);
    const st = await api('/api/state');
    meta.spi = Math.max(0, meta.layers.findIndex(l=>l.layer===st.layer));
    applyState(st);
    toast('re-seeded');
  } catch(e){ toast('seed failed: '+e.message); } finally{ busy = false; } }
function toggleLock(){
  lockNorth = !lockNorth;
  if (lockNorth){
    lockedYaw = ctrl.getAzimuthalAngle();
    ctrl.minAzimuthAngle = lockedYaw;
    ctrl.maxAzimuthAngle = lockedYaw;
  } else {
    ctrl.minAzimuthAngle = -Infinity;
    ctrl.maxAzimuthAngle = Infinity;
  }
  btnLockEl.textContent = lockNorth ? 'N \u2b23 on' : 'N off';
  btnLockEl.classList.toggle('on', lockNorth);
}

function toggleFP(){
  firstPerson = !firstPerson;
  ctrl.enabled = !firstPerson;
  cow.visible = !firstPerson;
  headYaw = 0; headPitch = 0;
  btnFpEl.textContent = firstPerson ? 'FPV on' : 'FPV';
  btnFpEl.classList.toggle('on', firstPerson);
  if (!firstPerson){
    cam.position.set(2.6, 1.7, 2.9);
    ctrl.target.set(0, 0, 0);
  }
}
document.getElementById('btn-fp').addEventListener('click', toggleFP);
const btnGenEl = document.getElementById('btn-gen');
function toggleGen(){
  genMode = !genMode;
  api('/api/gen', {mode:genMode}).then(applyState).catch(()=>{});
  btnGenEl.textContent = genMode ? 'gen on' : 'gen off';
  btnGenEl.classList.toggle('on', genMode);
}
document.getElementById('btn-gen').addEventListener('click', toggleGen);

document.getElementById('btn-reset').addEventListener('click', doReset);
document.getElementById('btn-lock').addEventListener('click', toggleLock);
document.getElementById('btn-seed').addEventListener('click', ()=>{
  seedPrompt(document.getElementById('inp-prompt').value);
  document.getElementById('inp-prompt').blur();   // return focus to canvas so hotkeys work
});
document.getElementById('inp-prompt').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){
    seedPrompt(e.target.value);
    e.target.blur();
  }
});
// clicking anywhere off the seed box returns focus to the canvas so hotkeys work again
addEventListener('pointerdown', (e)=>{
  const t = e.target;
  if (t && (t.id === 'inp-prompt' || t.closest && t.closest('.hud'))) return;
  document.getElementById('inp-prompt').blur();
  document.activeElement && document.activeElement.blur();
});
addEventListener('blur', ()=>{
  // leaving the window also drops input focus; keys work on return
  document.getElementById('inp-prompt').blur();
});

addEventListener('keydown', async (e)=>{
  const inInput = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  if (inInput) return;                     // never eat keystrokes while typing
  const map={ArrowRight:'right',ArrowLeft:'left',ArrowUp:'up',ArrowDown:'down'};
  if (busy) return;
  if(map[e.key]){ e.preventDefault(); await doMove(map[e.key]); }
  else if(e.key==='l'||e.key==='L'){ e.preventDefault(); await cycleLayer(); }
  else if(e.key==='g'||e.key==='G'){ e.preventDefault(); toggleFP(); }
  else if(e.key==='r'||e.key==='R'){ e.preventDefault(); await doReset(); }
  else if(e.key==='f'||e.key==='F'){ e.preventDefault(); toggleFP(); }
  else if(e.key==='p'||e.key==='P'){ e.preventDefault(); poleView(); }
  else if(e.key==='c'||e.key==='C'){ e.preventDefault(); commitToken(); }
});

// click-to-walk (clicks, not drags)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downXY = null;
canvas.addEventListener('pointerdown', (e)=>{ downXY = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', async (e)=>{
  if (!downXY) return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  downXY = null;
  if (Math.hypot(dx, dy) > 8) return;              // it was a drag = orbit
  ndc.x = (e.clientX/innerWidth)*2 - 1;
  ndc.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, cam);
  const hits = raycaster.intersectObjects(clickables, false);
  if (!hits.length) return;
  const az = hits[0].object.userData.az;
  if (az !== undefined){
    doGo(az);
  } else {
    const p = hits[0].point;
    const azHit = (Math.atan2(p.y, p.x) * 180 / Math.PI + 360) % 360;
    doGo(azHit);
  }
});
canvas.addEventListener('pointermove', (e)=>{
  if (firstPerson && downXY){
    headYaw -= (e.clientX - downXY[0]) * 0.004;
    headPitch = Math.max(-1.2, Math.min(1.2, headPitch + (e.clientY - downXY[1]) * 0.004));
    downXY = [e.clientX, e.clientY];
  }
  ndc.x = (e.clientX/innerWidth)*2 - 1;
  raycaster.setFromCamera(ndc, cam);
  canvas.style.cursor = raycaster.intersectObjects(clickables, false).length ? 'pointer' : 'grab';
});

// ---- hover to peek at novel tokens ----
const tipEl = document.getElementById('hover-tip');
let tipTimer = null, tipFetching = false, tipAz = null;
canvas.addEventListener('pointermove', throttleHover);
function throttleHover(e){
  if (tipTimer) return;
  tipTimer = setTimeout(()=>{ tipTimer = null; hoverPeek(e); }, 90);
}
async function hoverPeek(e){
  ndc.x = (e.clientX/innerWidth)*2 - 1;
  ndc.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, cam);
  const hits = raycaster.intersectObjects([steerSphere], false);
  if (!hits.length || firstPerson){ tipEl.style.display='none'; return; }
  const p = hits[0].point;
  const az = (Math.atan2(p.y, p.x) * 180 / Math.PI + 360) % 360;
  tipAz = az;
  if (tipFetching) return;
  tipFetching = true;
  try{
    const d = await api('/api/ringat', {az});
    if (d.token){
      tipEl.textContent = d.token + '  (' + Math.round(d.az) + '\u00b0)';
      tipEl.style.display = 'block';
      tipEl.style.left = (e.clientX + 14) + 'px';
      tipEl.style.top  = (e.clientY + 14) + 'px';
    }
  } catch(err){ /* silent */ }
  finally{ tipFetching = false; }
}

async function boot(){
  const md=await api('/api/layers');
  meta.model=md.model; meta.layers=md.layers;
  document.getElementById('h-model').textContent=md.model;
  document.getElementById('h-prompt').textContent=md.prompt || '';
  buildLegend(); projectTopicMarkers(meta.layers);
  const st=await api('/api/state');
  meta.spi=Math.max(0, meta.layers.findIndex(l=>l.layer===st.layer));
  applyState(st);
}
boot().catch(e=>toast('boot failed: '+e.message));

function poleView(){
  // look straight down the north pole (+Z) at the ring: plan view
  firstPerson = false;
  ctrl.enabled = true;
  cow.visible = true;
  cam.up.set(0, 1, 0);
  cam.position.set(0, 0.001, 3.4);
  ctrl.target.set(0, 0, 0);
  ctrl.minAzimuthAngle = -Infinity; ctrl.maxAzimuthAngle = Infinity;
  cam.lookAt(0, 0, 0);
  ctrl.update();
}
document.getElementById('btn-pole').addEventListener('click', poleView);

// commit the top-1 token (append current token, step) — 'c' key + used by walk actions
async function commitToken(){
  if (busy) return;
  const st = meta.state;
  const d = await api('/api/topk', {k:1}).catch(()=>null);
  if (d && d.tokens && d.tokens[0]){
    chosenTokenId = d.tokens[0].id;
    chooseToken(chosenTokenId);
  }
}
let chosenTokenId = null;

function tick(){
  if (firstPerson && meta.state){
    const p = cow.userData.base;
    cam.position.copy(p).multiplyScalar(1.0005);
    let dir = cow.userData.forward.clone();
    dir.applyAxisAngle(p, headYaw);
    const lateral = new THREE.Vector3().crossVectors(p, dir).normalize();
    dir.applyAxisAngle(lateral, headPitch);
    cam.up.copy(p);
    cam.lookAt(cam.position.clone().add(dir));
  }
  ctrl.update();
  cow.position.copy(cow.userData.base).multiplyScalar(1 + 0.02*Math.sin(performance.now()/240));
  renderer.render(scene,cam); requestAnimationFrame(tick);
}
tick();
addEventListener('resize', ()=>{ cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
